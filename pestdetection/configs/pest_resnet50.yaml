# Flagship training config — ResNet50 (per faculty recommendation over resnet18).
# Consumed by `leafscan train --config configs/pest_resnet50.yaml`.

name: pest_resnet50

# --- Data ---
data_dir: data/Pest_Dataset
split_csv: data/splits/pest_v1.csv   # reuse the same committed deterministic split
seed: 1337
split_ratios: [0.70, 0.15, 0.15]
min_eval_per_class: 5

# --- Model ---
arch: resnet50            # ~25M params; ImageNet-pretrained backbone
pretrained: true
freeze_backbone: false    # full linear-probe? no
freeze_early_stages: true # freeze conv1/bn1/layer1/layer2; fine-tune layer3+layer4+fc.
                          # Fits an 8 GB machine; set false for a full fine-tune on a bigger box.
input_size: 224
normalize:
  mean: [0.485, 0.456, 0.406]
  std:  [0.229, 0.224, 0.225]

# --- Optimisation ---
epochs: 14
batch_size: 32
lr: 0.0003                # slightly lower than resnet18 (larger model)
weight_decay: 0.0001
label_smoothing: 0.05
class_weighted_loss: true
num_workers: 4
scheduler: cosine

# --- Augmentation ---
augment:
  randaugment_ops: 2
  randaugment_magnitude: 7
  horizontal_flip: true

# --- Output ---
output_dir: models/pest_resnet50
reports_dir: reports
calibrate: true
abstain_threshold: 0.40
