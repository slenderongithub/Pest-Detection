[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leafscan"
version = "1.0.0"
description = "Industry-standard pest classification: one shared, tested inference/training core behind a Streamlit UI and a Starlette API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shubhadeep Datta" }]
keywords = ["pest-detection", "image-classification", "grad-cam", "pytorch", "agriculture"]

# Ranged pins matched to the ACTUAL working environment (torch 2.2 / torchvision 0.17),
# not the historical, uninstallable requirements.txt (torch==1.4.0 etc.).
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.24,<2",  # torch 2.2/tv 0.17 wheels are built against NumPy 1.x; numpy>=2 breaks the tensor<->ndarray bridge ("Numpy is not available")
    "pillow>=10.0",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
]

[project.optional-dependencies]
serve = [
    "streamlit>=1.32",
    "starlette>=0.36",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]
train = [
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    # timm is optional for extra backbones (convnext/efficientnet). The flagship
    # resnet18 path uses torchvision only, so timm is not required to reproduce it.
    "timm>=0.9",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "httpx>=0.26",
    "openpyxl>=3.1",
]

[project.scripts]
leafscan = "leafscan.cli:main"

[tool.setuptools]
packages = ["leafscan"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length handled by formatter; long CSS/HTML strings in apps

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
